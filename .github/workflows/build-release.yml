name: Build & Release Bundle

on:
  push:
    branches: [dev]
    paths:
      - "src-tauri/Cargo.toml" # Triggered by version bump
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Skip build and use exe from previous release (for dependency-only updates)"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  merge-to-main:
    # Ports inherit this file on sync merges; only run it in the desktop repo.
    if: github.repository == 'winters27/StreamNook'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge dev to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          # Force-push dev to main (dev is source of truth)
          git push origin origin/dev:main --force

  # macOS build. Runs in PARALLEL with the Windows job and nothing waits on it:
  # finalize-macos joins the two afterwards and patches this job's outputs into
  # the manifest. A macOS failure therefore skips finalize-macos and leaves a
  # Windows-only release standing, rather than holding up every Windows user.
  build-macos:
    needs: merge-to-main
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      BUNDLE_NAME: ${{ steps.pack.outputs.BUNDLE_NAME }}
      SHA256: ${{ steps.pack.outputs.SHA256 }}
      SIZE: ${{ steps.pack.outputs.SIZE }}
      SIGNATURE: ${{ steps.sign.outputs.SIGNATURE }}
      DOWNLOAD_URL: ${{ steps.pack.outputs.DOWNLOAD_URL }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      # Release-exists guard, the macOS twin of the Windows job's check. This
      # workflow fires on ANY `dev` push that touches Cargo.toml, release or
      # not, and every upload below is `--clobber`. Without this guard a
      # dependency bump after a release would rebuild the macOS bundle from a
      # different tree and overwrite the published assets under the same tag,
      # so an installed client's pinned hash would no longer match what the
      # release serves. When the tag already exists, every step from here on
      # is skipped and the job's outputs stay empty; the `build` job already
      # treats empty macOS outputs as "no macOS entry in the manifest".
      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "RELEASE_EXISTS=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists; skipping the macOS build so its published assets are not clobbered"
          else
            echo "RELEASE_EXISTS=false" >> "$GITHUB_OUTPUT"
            echo "Release v$version does not exist; building the macOS bundle"
          fi

      - name: Setup Node.js
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both halves of the universal binary. `universal-apple-darwin` is not
          # a toolchain of its own: tauri builds each arch and `lipo`s them, so
          # both must be installed or the build fails at the second one.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: macos

      - name: Install dependencies
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        run: npm ci

      - name: Build Tauri app (universal)
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          # Same values the Windows job uses; the client IDs are public by
          # construction (see the comment on the Windows build step).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TWITCH_APP_CLIENT_ID: "1qgws7yzcp21g5ledlzffw3lmqdvie"
          TWITCH_APP_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_ANDROID_CLIENT_ID: "kd1unb4b3q4t58fwlpcbzcbnm76a8fp"
          TWITCH_WEB_CLIENT_ID: "kimne78kx3ncx6brgo4mv6wki5h1ko"
          KICK_APP_CLIENT_ID: "01KMKM0HVR6HY0BMA101JFCTW3"
          KICK_APP_CLIENT_SECRET: ${{ secrets.KICK_APP_CLIENT_SECRET }}

      - name: Pack the .app into a tarball
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        id: pack
        run: |
          set -euo pipefail
          version=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          app_dir="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          test -d "$app_dir/StreamNook.app" || { echo "no .app at $app_dir"; exit 1; }
          bundle="StreamNook.app.tar.gz"
          # -C so the archive root IS StreamNook.app, not the path to it: the
          # updater untars straight over the installed bundle.
          #
          # macOS tar writes ._* AppleDouble entries for extended attributes,
          # which are noise at best and confuse strict extractors. COPYFILE_DISABLE
          # suppresses them.
          COPYFILE_DISABLE=1 tar -czf "$bundle" -C "$app_dir" StreamNook.app
          echo "BUNDLE_NAME=$bundle" >> "$GITHUB_OUTPUT"
          echo "SHA256=$(shasum -a 256 "$bundle" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "SIZE=$(stat -f%z "$bundle")" >> "$GITHUB_OUTPUT"
          echo "DOWNLOAD_URL=https://streamnook.app/download/mac" >> "$GITHUB_OUTPUT"
          echo "Packed $bundle ($(du -h "$bundle" | cut -f1)) for v$version"

      - name: Sign the tarball with the update key
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        id: sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          bundle="${{ steps.pack.outputs.BUNDLE_NAME }}"
          if [ -z "${UPDATE_SIGNING_KEY:-}" ]; then
            echo "UPDATE_SIGNING_KEY not set - publishing an UNSIGNED macOS update"
            echo "SIGNATURE=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The SAME key that signs the Windows bundle. The client pins one
          # public half as a compile-time const; a second key would mean a second
          # pinned constant, and the value of pinning is that there is one secret
          # to protect.
          brew install minisign
          printf '%s' "$UPDATE_SIGNING_KEY" > ./update.key
          trap 'rm -f ./update.key' EXIT
          minisign -S -s ./update.key -m "$bundle" -x "$bundle.minisig"
          # Collapse to one line: the manifest carries it as a JSON string, and
          # the client verifies the signature bytes, not the comment lines.
          echo "SIGNATURE<<EOF" >> "$GITHUB_OUTPUT"
          cat "$bundle.minisig" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Signed $bundle"

      # The GitHub release is created by the Windows `build` job, which runs
      # AFTER this one (it needs our outputs for the manifest). So this job can
      # never wait for the release: it would wait forever, fail, and take the
      # Windows release down with it. Hand the bundle over as a workflow
      # artifact instead; `build` attaches it right after `gh release create`.
      - name: Hand the macOS bundle to the release job
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: |
            ${{ steps.pack.outputs.BUNDLE_NAME }}
            ${{ steps.pack.outputs.BUNDLE_NAME }}.minisig
          if-no-files-found: error
          retention-days: 3

      - name: Push macOS bundle to Cloudflare R2
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bundle="${{ steps.pack.outputs.BUNDLE_NAME }}"
          npx --yes wrangler@4 r2 object put "streamnook-downloads/mac/$bundle" \
            --file="$bundle" \
            --content-type="application/gzip" \
            --remote
          echo "Uploaded mac/$bundle to R2"

      # NOT NOTARIZED YET. minisign proves the bundle came from us; Gatekeeper
      # does not care about minisign and wants a Developer ID signature plus
      # notarization, which needs the paid Apple Developer Program.
      #
      # Consequence, precisely: an update installed BY THE UPDATER works, because
      # a programmatic download carries no com.apple.quarantine attribute. A
      # bundle a human downloads from the website WILL be quarantined and
      # Gatekeeper-blocked. So this pipeline is correct for updates and not yet
      # correct for first-time installs.

  # Linux build. Same independent-and-joined-afterwards shape as build-macos:
  # runs in parallel with Windows, nothing waits on it, and finalize-linux
  # patches its outputs into the manifest once both have landed. A Linux failure
  # leaves the Windows (and macOS) release standing.
  build-linux:
    needs: merge-to-main
    runs-on: ubuntu-22.04
    # NOT ubuntu-latest, and this is not stylistic. glibc is forward-compatible
    # only: a binary linked against 24.04's glibc refuses to start on 22.04 with
    # `GLIBC_2.38 not found`, so the OLDEST supported runner is the correct
    # builder and `ubuntu-latest` silently moves that floor under us on GitHub's
    # schedule rather than ours. Raise this deliberately or not at all.
    permissions:
      contents: write
    outputs:
      BUNDLE_NAME: ${{ steps.pack.outputs.BUNDLE_NAME }}
      SHA256: ${{ steps.pack.outputs.SHA256 }}
      SIZE: ${{ steps.pack.outputs.SIZE }}
      SIGNATURE: ${{ steps.sign.outputs.SIGNATURE }}
      DOWNLOAD_URL: ${{ steps.pack.outputs.DOWNLOAD_URL }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      # Release-exists guard, the Linux twin of the macOS and Windows checks.
      # Same reasoning: every upload below is --clobber, and this workflow fires
      # on ANY dev push touching Cargo.toml, so without the guard a dependency
      # bump after a release would rebuild from a different tree and overwrite
      # published assets under the same tag, breaking every installed client's
      # pinned hash.
      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "RELEASE_EXISTS=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists; skipping the Linux build so its published assets are not clobbered"
          else
            echo "RELEASE_EXISTS=false" >> "$GITHUB_OUTPUT"
            echo "Release v$version does not exist; building the Linux bundle"
          fi

      # Verified against this exact set on Ubuntu 26.04 before the job existed:
      # webkit2gtk-4.1, javascriptcoregtk-4.1, gtk+-3.0, libsoup-3.0,
      # ayatana-appindicator3-0.1, librsvg-2.0, openssl and libwebp all resolve,
      # and the whole crate graph checks and tests clean with no cfg changes.
      #
      #   libssl-dev  - openssl-sys, pulled in by tokio-tungstenite's native-tls
      #                 (reqwest is on rustls, tungstenite is not)
      #   libwebp-dev - libwebp-sys2, via webp-animation
      #   appindicator + rsvg - the tray icon
      #   patchelf, file, desktop-file-utils - the AppImage bundler's own tools
      #   xdg-utils  - the bundler shells out to `xdg-mime` and dies with
      #                "xdg-mime binary not found" without it. Found by running
      #                this build for real: the Rust half finished and only the
      #                bundling step failed, which is the one part a `cargo
      #                build` can never tell you about.
      #
      # THE GSTREAMER PLUGINS ARE NOT OPTIONAL, and their absence is silent.
      # WebKitGTK answers `MediaSource.isTypeSupported()` out of whatever
      # GStreamer decoders it can find, and hls.js gates the entire player on
      # `isTypeSupported('video/mp4; codecs="avc1.42E01E,mp4a.40.2"')`. With only
      # plugins-base and plugins-good installed, MediaSource and SourceBuffer both
      # EXIST and every codec query returns false, so the build succeeds, the app
      # launches, streams resolve with a full quality ladder, and the player dies
      # with "HLS is not supported in this browser". Measured on a real build:
      #
      #   base+good only : h264+aac false, h264 false, aac false, vp9 false
      #   + libav/bad/ugly: h264+aac TRUE,  h264 TRUE,  aac TRUE,  vp9 TRUE
      #
      # linuxdeploy-plugin-gstreamer bundles whatever is installed HERE into the
      # AppImage, so this list is what every Linux user's decoder set will be.
      # vp9 is in that list for YouTube playback, not for Twitch.
      - name: Install Linux build dependencies
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebp-dev \
            libsoup-3.0-dev \
            patchelf \
            file \
            desktop-file-utils \
            xdg-utils \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

      - name: Setup Node.js
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: linux

      - name: Install dependencies
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        run: npm ci

      - name: Build Tauri app
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        run: npm run tauri build
        env:
          # Same values the Windows and macOS jobs use; the client IDs are
          # public by construction (see the comment on the Windows build step).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TWITCH_APP_CLIENT_ID: "1qgws7yzcp21g5ledlzffw3lmqdvie"
          TWITCH_APP_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_ANDROID_CLIENT_ID: "kd1unb4b3q4t58fwlpcbzcbnm76a8fp"
          TWITCH_WEB_CLIENT_ID: "kimne78kx3ncx6brgo4mv6wki5h1ko"
          KICK_APP_CLIENT_ID: "01KMKM0HVR6HY0BMA101JFCTW3"
          KICK_APP_CLIENT_SECRET: ${{ secrets.KICK_APP_CLIENT_SECRET }}

      # Remove the GPU DRIVER LOADERS from the bundle and repack.
      #
      # `libva` and `libvulkan` are loaders: they dlopen the HOST's GPU driver
      # (iHD_drv_video.so, radeonsi_drv_video.so, the Vulkan ICDs), and loader
      # and driver must be ABI-compatible. Shipping our own means a user on a
      # different distro gets a loader that cannot open their driver,
      # va_openDriver() fails, and GStreamer silently falls back to SOFTWARE
      # decode - on exactly the machines where hardware decode matters most. The
      # user-visible symptom is a stuttering 1080p60 stream on a perfectly
      # capable GPU, with nothing logged to explain it.
      #
      # linuxdeploy already excludes libGL, libEGL, libdrm and libgbm for this
      # reason (verified: those come from the host). These four slip past because
      # linuxdeploy-plugin-gstreamer copies its plugins' own dependencies without
      # consulting that excludelist.
      #
      # The DECODER PLUGINS stay (libgstva, libgstnvcodec, libgstlibav,
      # libgstopenh264): the plugin is ours to ship, the loader is the host's.
      # A host with no libva at all just fails to load libgstva and falls through
      # to software decode, which is what it would have done anyway.
      #
      # Verified on a real build: after stripping, the app launches with no
      # plugin-load failures and Twitch video still decodes and plays.
      - name: Unbundle the host GPU loaders
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        env:
          # linuxdeploy ships as an AppImage and GitHub runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -euo pipefail
          bundle="src-tauri/target/release/bundle/appimage"
          appdir="$bundle/StreamNook.AppDir"
          test -d "$appdir" || { echo "no AppDir at $appdir"; ls -R "$bundle" || true; exit 1; }

          # Two groups, one principle: anything the HOST's graphics stack loads
          # must come from the host.
          #
          # 1. The GPU driver loaders (libva, libvulkan), which dlopen the host's
          #    driver and must be ABI-compatible with it.
          # 2. Low-level libraries that mesa and the EGL stack themselves pull
          #    in. These are on the AppImage community excludelist for exactly
          #    this reason, and leaving them in is NOT cosmetic: a CI artifact
          #    built here died with "Could not create default EGL display:
          #    EGL_BAD_PARAMETER. Aborting..." and rendered a BLANK WINDOW on a
          #    newer host. Deleting these eight from the AppDir made the same
          #    artifact paint in 12 seconds. Measured, not reasoned.
          #
          # This is the trap that makes the ubuntu-22.04 pin cut both ways:
          # building on the oldest distro is right for the glibc floor, and it
          # also guarantees every bundled library is the OLDEST, which maximises
          # the mismatch against every user newer than the builder. The
          # resolution is to not ship these at all.
          removed=0
          for lib in libva.so.2 libva-drm.so.2 libva-x11.so.2 libvulkan.so.1 \
                     libwayland-client.so.0 libwayland-egl.so.1 \
                     libwayland-server.so.0 libwayland-cursor.so.0 \
                     libffi.so.8 libzstd.so.1 libelf.so.1 libgomp.so.1; do
            while IFS= read -r f; do
              rm -f "$f"; echo "unbundled $lib"; removed=$((removed+1))
            done < <(find "$appdir" -name "$lib")
          done
          echo "unbundled $removed host-coupled librar(ies)"

          # The decoders must survive; without them the player dies with
          # "HLS is not supported in this browser".
          for keep in libgstlibav.so libgstopenh264.so; do
            find "$appdir" -name "$keep" | grep -q . || { echo "$keep went missing"; exit 1; }
          done

          # Find the packer rather than assuming one path: tauri caches it under
          # ~/.cache/tauri today, but a hardcoded path that moves would abort the
          # whole Linux job on a step that is meant to be a refinement.
          tool=$(find "$HOME/.cache" -name "linuxdeploy-plugin-appimage*.AppImage" -type f 2>/dev/null | head -1)
          if [ -z "$tool" ]; then
            echo "::error title=AppImage packer not found::Could not locate linuxdeploy-plugin-appimage under \$HOME/.cache. The GPU driver loaders are still bundled, which silently costs users hardware decode, so this fails rather than shipping that."
            exit 1
          fi
          chmod +x "$tool"

          # Repack BESIDE the original and only replace it once the new one
          # exists. Deleting first means a failed repack leaves the job with no
          # artifact at all, turning a refinement into a lost release.
          old=$(find "$bundle" -maxdepth 1 -name '*.AppImage' | head -1)
          test -n "$old" || { echo "no AppImage to repack"; exit 1; }
          work="$bundle/repack"
          rm -rf "$work"; mkdir -p "$work"
          ( cd "$work" && LINUXDEPLOY_OUTPUT_APP_NAME=StreamNook "$tool" --appdir ../StreamNook.AppDir )
          new=$(find "$work" -maxdepth 1 -name '*.AppImage' | head -1)
          test -s "$new" || { echo "repack produced nothing; keeping the original"; exit 1; }
          mv -f "$new" "$old"
          rm -rf "$work"
          chmod +x "$old"
          ls -la "$bundle"/*.AppImage

      - name: Name and hash the AppImage
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        id: pack
        run: |
          set -euo pipefail
          version=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          src_dir="src-tauri/target/release/bundle/appimage"
          # The bundler names it StreamNook_<version>_amd64.AppImage. The client
          # asks for the STABLE name (default_bundle_name() returns
          # "StreamNook.AppImage" and stage_linux_bundle parks it under that), so
          # rename rather than teaching the client a version-dependent filename.
          built=$(find "$src_dir" -maxdepth 1 -name '*.AppImage' | head -1)
          test -n "$built" || { echo "no .AppImage under $src_dir"; ls -R "$src_dir" || true; exit 1; }
          bundle="StreamNook.AppImage"
          mv "$built" "$bundle"
          chmod +x "$bundle"
          # Refuse to publish something that is not actually an AppImage. The
          # client checks these same magic bytes before installing (see
          # looks_like_an_appimage in commands/components.rs), so checking here
          # means a bundler change lands as a red runner rather than as a failed
          # update on a user's machine. 11 bytes = 22 hex chars: the ELF magic,
          # four bytes of ELF identification, then AI\x02 at offset 8.
          magic=$(head -c 11 "$bundle" | od -An -tx1 | tr -d ' \n')
          case "$magic" in
            7f454c46????????414902) ;;
            *) echo "built artifact is not a type-2 AppImage (magic: $magic)"; exit 1 ;;
          esac
          echo "BUNDLE_NAME=$bundle" >> "$GITHUB_OUTPUT"
          echo "SHA256=$(sha256sum "$bundle" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "SIZE=$(stat -c%s "$bundle")" >> "$GITHUB_OUTPUT"
          echo "DOWNLOAD_URL=https://streamnook.app/download/linux" >> "$GITHUB_OUTPUT"
          echo "Packed $bundle ($(du -h "$bundle" | cut -f1)) for v$version"

      - name: Sign the AppImage with the update key
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        id: sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          bundle="${{ steps.pack.outputs.BUNDLE_NAME }}"
          if [ -z "${UPDATE_SIGNING_KEY:-}" ]; then
            echo "UPDATE_SIGNING_KEY not set - publishing an UNSIGNED Linux update"
            echo "SIGNATURE=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The SAME key that signs the Windows and macOS bundles; the client
          # pins one public half as a compile-time const.
          # The official static binary, pinned, as the Windows job does. apt has no
          # `minisign` package on ubuntu-22.04 ("Unable to locate package").
          ms_ver=0.12
          curl -fsSL -o minisign.tgz "https://github.com/jedisct1/minisign/releases/download/$ms_ver/minisign-$ms_ver-linux.tar.gz"
          tar xzf minisign.tgz 2>/dev/null
          ms=./minisign-linux/x86_64/minisign
          [ -x "$ms" ] || { echo "::error title=minisign missing::$ms not found in minisign-$ms_ver-linux.tar.gz"; exit 1; }
          printf '%s' "$UPDATE_SIGNING_KEY" > ./update.key
          trap 'rm -f ./update.key' EXIT
          "$ms" -S -s ./update.key -m "$bundle" -x "$bundle.minisig"
          echo "SIGNATURE<<EOF" >> "$GITHUB_OUTPUT"
          cat "$bundle.minisig" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Signed $bundle"

      # Same handover as macOS: the GitHub release is created by the Windows
      # `build` job, which runs in parallel with this one, so this job can never
      # wait for it.
      - name: Hand the Linux bundle to the release job
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: |
            ${{ steps.pack.outputs.BUNDLE_NAME }}
            ${{ steps.pack.outputs.BUNDLE_NAME }}.minisig
          if-no-files-found: error
          retention-days: 3

      - name: Push Linux bundle to Cloudflare R2
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bundle="${{ steps.pack.outputs.BUNDLE_NAME }}"
          npx --yes wrangler@4 r2 object put "streamnook-downloads/linux/$bundle" \
            --file="$bundle" \
            --content-type="application/x-executable" \
            --remote
          echo "Uploaded linux/$bundle to R2"

      # NO SIGNING GATE HERE, unlike macOS. Linux has no Gatekeeper equivalent:
      # an AppImage a human downloads runs once they mark it executable, so this
      # pipeline is correct for first-time installs as well as for updates. The
      # minisign signature is still published and still the only control that
      # survives a compromise of the update host.

  build:
    # Deliberately does NOT need build-macos. It used to, and the cost was
    # measured: build-macos runs 32-51 min, and `needs` makes Windows WAIT for it
    # even though the old comment here already said a Mac failure should not
    # block "every Windows user's update". It solved the failure case and not the
    # latency one. 8.6.1, before macOS existed, shipped in 35 min; 8.6.2 took 96
    # and 8.6.3 took 80. The two jobs are independent, so they run in parallel and
    # finalize-macos below joins them afterwards.
    needs: merge-to-main
    if: ${{ !cancelled() && needs.merge-to-main.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
      RELEASE_EXISTS: ${{ steps.check_release.outputs.RELEASE_EXISTS }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          if ($cargo -match 'version\s*=\s*"([^"]+)"') {
            $version = $matches[1]
            echo "VERSION=$version" >> $env:GITHUB_OUTPUT
            echo "Found version: $version"
          } else {
            echo "Could not find version in Cargo.toml"
            exit 1
          }

      - name: Check if release already exists
        id: check_release
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          $exists = $releases | Where-Object { $_.tagName -eq "v$version" }
          if ($exists) {
            echo "RELEASE_EXISTS=true" >> $env:GITHUB_OUTPUT
            echo "Release v$version already exists, skipping..."
          } else {
            echo "RELEASE_EXISTS=false" >> $env:GITHUB_OUTPUT
            echo "Release v$version does not exist, will create"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true
          shared-key: "rust-build"

      - name: Install dependencies
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        run: npm ci

      - name: Pre-install WiX Toolset
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        shell: pwsh
        run: |
          # Pre-download WiX to avoid timeout during Tauri build
          $wixDir = "$env:LOCALAPPDATA\tauri\WixTools"

          if (Test-Path $wixDir) {
            echo "WiX Toolset already cached"
          } else {
            echo "Downloading WiX Toolset..."
            New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
            
            # Download with retry and increased timeout
            $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
            $wixZip = "$env:TEMP\wix314-binaries.zip"
            
            $webClient = New-Object System.Net.WebClient
            $retries = 3
            $success = $false
            
            for ($i = 1; $i -le $retries; $i++) {
              try {
                echo "Download attempt $i of $retries..."
                $webClient.DownloadFile($wixUrl, $wixZip)
                $success = $true
                break
              } catch {
                echo "Attempt $i failed: $_"
                if ($i -lt $retries) {
                  Start-Sleep -Seconds 5
                }
              }
            }
            
            if (-not $success) {
              echo "Failed to download WiX after $retries attempts"
              exit 1
            }
            
            echo "Extracting WiX Toolset..."
            Expand-Archive -Path $wixZip -DestinationPath $wixDir -Force
            Remove-Item $wixZip -Force
            
            echo "WiX Toolset installed to: $wixDir"
          }

          # Verify WiX installation
          if (Test-Path "$wixDir\candle.exe") {
            echo "WiX Toolset verified successfully"
          } else {
            echo "WiX Toolset verification failed"
            exit 1
          }

      - name: Build Tauri app
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false' && inputs.skip_build != 'true'
        shell: pwsh
        run: npm run tauri build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # OAuth CLIENT IDs are public by construction: they appear in every
          # authorize URL the app opens and in our own wrangler configs. Storing
          # them as repo secrets implied a confidentiality they never had, which
          # made it look like rotating them would achieve something. Only the
          # SECRETS below are real secrets.
          TWITCH_APP_CLIENT_ID: "1qgws7yzcp21g5ledlzffw3lmqdvie"
          TWITCH_APP_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_ANDROID_CLIENT_ID: "kd1unb4b3q4t58fwlpcbzcbnm76a8fp"
          TWITCH_WEB_CLIENT_ID: "kimne78kx3ncx6brgo4mv6wki5h1ko"
          KICK_APP_CLIENT_ID: "01KMKM0HVR6HY0BMA101JFCTW3"
          KICK_APP_CLIENT_SECRET: ${{ secrets.KICK_APP_CLIENT_SECRET }}

      - name: Download StreamNook.exe from previous release (skip_build mode)
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false' && inputs.skip_build == 'true'
        shell: pwsh
        run: |
          # Get the latest release
          $latestRelease = gh release view --json assets,tagName | ConvertFrom-Json
          echo "Latest release: $($latestRelease.tagName)"

          # Find the exe or bundle
          $exeAsset = $latestRelease.assets | Where-Object { $_.name -like "*.exe" -or $_.name -eq "StreamNook.7z" }
          if ($exeAsset) {
            echo "Downloading: $($exeAsset.name)"
            gh release download $latestRelease.tagName -p $exeAsset.name -D ./previous-release
          } else {
            echo "No exe found in previous release"
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy StreamNook.exe to bundle
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        shell: pwsh
        run: |
          # The bundle dir used to be created by the Streamlink download step.
          New-Item -ItemType Directory -Force -Path ./bundle | Out-Null
          if ("${{ inputs.skip_build }}" -eq "true") {
            # Use exe from previous release
            $exe = Get-ChildItem ./previous-release -Filter "*.exe" | Select-Object -First 1
            if ($exe) {
              Copy-Item $exe.FullName ./bundle/StreamNook.exe
            } else {
              # Extract from previous bundle
              $bundle = Get-ChildItem ./previous-release -Filter "StreamNook.7z" | Select-Object -First 1
              if ($bundle) {
                7z x $bundle.FullName -o"./previous-release/extracted"
                Copy-Item ./previous-release/extracted/StreamNook.exe ./bundle/
              }
            }
          } else {
            # Use freshly built exe
            Copy-Item src-tauri/target/release/StreamNook.exe ./bundle/
          }
          echo "StreamNook.exe copied to bundle"

      - name: Copy CHANGELOG.md to bundle
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        shell: pwsh
        run: |
          Copy-Item CHANGELOG.md ./bundle/
          echo "CHANGELOG.md copied to bundle"
          # Note: Analytics dashboard is now embedded directly in the exe via rust-embed
          # No separate resources folder needed

      - name: Generate components.json
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          # Streamlink/TTV-LOL are no longer bundled. Keep the (now empty) fields
          # so the components.json schema still parses on any client.
          $streamlinkVersion = ""
          $ttvlolVersion = ""
          $buildDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

          $components = @{
            schema_version = 1
            streamnook = @{
              version = $version
              build_date = $buildDate
            }
            components = @{
              streamlink = @{
                version = $streamlinkVersion
                source_url = "https://github.com/streamlink/windows-builds/releases"
              }
              ttvlol = @{
                version = $ttvlolVersion
                source_url = "https://github.com/2bc4/streamlink-ttvlol/releases"
              }
            }
          }

          $json = $components | ConvertTo-Json -Depth 10
          $json | Out-File -FilePath ./bundle/components.json -Encoding utf8
          echo "components.json created:"
          echo $json

      - name: Create 7z bundle
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        shell: pwsh
        run: |
          $bundleName = "StreamNook.7z"

          # Create 7z archive (exe only). components.json is uploaded as a
          # separate top-level asset for older clients' version check; the new
          # updater reads the binary's own compiled-in version instead.
          cd bundle
          7z a -t7z -mx=9 "../$bundleName" StreamNook.exe
          cd ..

          echo "BUNDLE_NAME=$bundleName" >> $env:GITHUB_OUTPUT
          echo "Created: $bundleName"

          # Show bundle size
          $size = (Get-Item $bundleName).Length / 1MB
          echo "Bundle size: $([math]::Round($size, 2)) MB"
        id: bundle

      - name: Generate checksums
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        shell: pwsh
        run: |
          $bundleName = "${{ steps.bundle.outputs.BUNDLE_NAME }}"
          $hash = (Get-FileHash $bundleName -Algorithm SHA256).Hash
          "$hash  $bundleName" | Out-File -FilePath checksums.txt -Encoding utf8
          echo "Checksums generated:"
          Get-Content checksums.txt

      - name: Extract changelog for this version
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        id: changelog
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $changelog = Get-Content CHANGELOG.md -Raw

          # Try to extract section for this version
          $pattern = "(?s)## \[?$version\]?.*?(?=## \[|\z)"
          if ($changelog -match $pattern) {
            $section = $matches[0].Trim()
            # Write to temp file for use in release step
            $section | Out-File -FilePath ./changelog_section.md -Encoding utf8
            echo "Found changelog section for v$version"
          } else {
            "Release v$version" | Out-File -FilePath ./changelog_section.md -Encoding utf8
            echo "No changelog section found, using default"
          }

      - name: Create GitHub Release
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $bundleName = "${{ steps.bundle.outputs.BUNDLE_NAME }}"

          # Read changelog section from temp file
          $changelogSection = Get-Content ./changelog_section.md -Raw

          # Build the install instructions section
          $lines = @()
          $lines += ""
          $lines += "---"
          $lines += ""
          $lines += "### Installation"
          $lines += "1. Download ``$bundleName``"
          $lines += "2. Extract the .7z file"
          $lines += "3. Run ``StreamNook.exe``"

          $componentInfo = $lines -join "`n"
          $notes = $changelogSection + $componentInfo

          # Write to file for gh release
          $notes | Out-File -FilePath ./release_notes.md -Encoding utf8

          gh release create "v$version" --title "StreamNook v$version" --notes-file ./release_notes.md "$bundleName" "bundle/components.json" "checksums.txt"

          echo "Release v$version created!"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The macOS job cannot attach to a release that does not exist yet (it
      # runs before this job), so it parks the bundle as a workflow artifact
      # and we attach it here. Skipped when the macOS job produced nothing.
      - name: Push installer to Cloudflare R2
        # Mirrors StreamNook.7z to the R2 bucket that streamnook.app serves at
        # /download, so the website's download button always hands out this
        # build with no GitHub redirect. Requires two repo secrets:
        #   CLOUDFLARE_API_TOKEN  - token with "Workers R2 Storage: Edit"
        #   CLOUDFLARE_ACCOUNT_ID - the Cloudflare account id
        # If those secrets are absent the step is skipped (release still succeeds).
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false' && env.CLOUDFLARE_API_TOKEN != ''
        shell: pwsh
        run: |
          $bundleName = "${{ steps.bundle.outputs.BUNDLE_NAME }}"
          $version = "${{ steps.version.outputs.VERSION }}"
          Write-Host "Uploading $bundleName (v$version) to R2 bucket streamnook-downloads..."
          npx --yes wrangler@4 r2 object put "streamnook-downloads/StreamNook.7z" `
            --file="$bundleName" `
            --content-type="application/x-7z-compressed" `
            --remote
          if ($LASTEXITCODE -ne 0) { throw "wrangler r2 upload failed (exit $LASTEXITCODE)" }
          Write-Host "Uploaded StreamNook.7z (v$version) to R2 - live at https://streamnook.app/download"

          # Build and upload the update manifest the desktop client reads at
          # streamnook.app/api/v1/update (served from R2 as latest.json). Without
          # this, installed clients keep seeing the previous version and either
          # miss the update or get prompted to "update" to an older build.
          # Detached minisign signature over the bundle bytes.
          #
          # This is the only integrity control that survives a compromise of the
          # update host: sha256 and the bundle are served by the same server, so
          # whoever can serve a bad bundle can serve a matching hash. The secret
          # key exists only as a CI secret and must never reach the host serving
          # updates. The client pins the PUBLIC half as a compile-time const.
          #
          # Skipped (not failed) while UPDATE_SIGNING_KEY is unset, so signing can
          # be turned on without a release being blocked on it. The client is in
          # warn-only mode until its ENFORCE_UPDATE_SIGNATURE flips, and that flip
          # must not happen until releases here are reliably signed.
          $signature = $null
          if ($env:UPDATE_SIGNING_KEY) {
            # The official binary, pinned. `npm i -g minisign-cli` was a 404 (that
            # package does not exist) and the `minisign` npm package exits 1 with
            # no output, so both were silently doing nothing: the moment a signing
            # key existed, the `throw` below would have failed every release build.
            # Verified end to end locally against 0.12 before this was enabled.
            $msVer = '0.12'
            $msZip = "minisign-$msVer-win64.zip"
            Invoke-WebRequest "https://github.com/jedisct1/minisign/releases/download/$msVer/$msZip" -OutFile $msZip -UseBasicParsing
            Expand-Archive $msZip -DestinationPath ./minisign-bin -Force
            # The archive carries both architectures; runners are x86_64.
            $ms = (Get-ChildItem ./minisign-bin -Recurse -Filter minisign.exe |
                   Where-Object { $_.FullName -match 'x86_64' } |
                   Select-Object -First 1).FullName
            if (-not $ms) { throw "minisign.exe (x86_64) not found in $msZip" }
            $env:UPDATE_SIGNING_KEY | Out-File -FilePath ./update.key -Encoding ascii -NoNewline
            try {
              & $ms -S -s ./update.key -m "$bundleName" -x "$bundleName.minisig"
              if ($LASTEXITCODE -ne 0) { throw "minisign failed (exit $LASTEXITCODE)" }
              $signature = (Get-Content "$bundleName.minisig" -Raw).TrimEnd()
              Write-Host "Signed $bundleName"
              # Also attach it to the GitHub release. The in-app updater reads the
              # signature from the R2 manifest, not from here, but people do
              # download straight off the releases page and this is what lets them
              # verify that copy by hand:
              #   minisign -Vm StreamNook.7z -P <public key>
              gh release upload "v$version" "$bundleName.minisig" --clobber
              if ($LASTEXITCODE -ne 0) { Write-Host "WARN: could not attach .minisig to the release" }
            } finally {
              # Never leave the secret key on the runner filesystem.
              Remove-Item ./update.key -Force -ErrorAction SilentlyContinue
            }
          } else {
            Write-Host "UPDATE_SIGNING_KEY not set - publishing an UNSIGNED update"
          }

          $winSha = (Get-FileHash "$bundleName" -Algorithm SHA256).Hash.ToLower()
          $winSize = (Get-Item "$bundleName").Length

          # Per-platform builds, keyed <os>-<arch> to match std::env::consts and
          # the plugin index's own `platforms` map.
          $platforms = [ordered]@{
            "windows-x86_64" = [ordered]@{
              download_url = "https://streamnook.app/download"
              bundle_name  = $bundleName
              sha256       = $winSha
              signature    = $signature
              size         = $winSize
            }
          }

          # The macOS and Linux entries for the NEW version are patched in
          # afterwards by finalize-macos / finalize-linux, so Windows users are not
          # made to wait 32-51 min for a Mac build to publish their update. An entry
          # pointing at a build that does not exist is worse than no entry, because
          # the client would offer an update and then fail to download it.
          #
          # But dropping the non-Windows keys entirely was ALSO wrong, and cost real
          # users: with no key for their <os>-<arch>, a Mac gets
          # `artifact_for_platform() == None` and is told "no update", traced only
          # by one log line. That happened on EVERY release for the 32-51 min
          # window, and for the WHOLE cycle whenever build-macos failed, because
          # finalize-macos is skipped when its outputs are empty.
          #
          # So carry the PREVIOUS manifest's macOS and Linux entries forward. They
          # point at the last build for that platform, which really does exist, so a
          # client checking during the window is offered the previous release rather
          # than nothing, and finalize-* overwrites them minutes later. A client
          # already on that version simply sees no update, which is correct.
          #
          # linux-x86_64 is in this list from the day the Linux job landed, not
          # added later after the same gap bit Linux users too.
          $prevManifest = $null
          try {
            $prevManifest = Invoke-RestMethod -Uri "https://streamnook.app/api/v1/update" -TimeoutSec 20
          } catch {
            Write-Host "::warning::Could not read the previous manifest ($($_.Exception.Message)); macOS keys will be absent until finalize-macos runs."
          }
          if ($prevManifest -and $prevManifest.platforms) {
            foreach ($key in @("macos-aarch64", "macos-x86_64", "linux-x86_64")) {
              $prev = $prevManifest.platforms.$key
              if ($prev -and $prev.download_url) {
                $platforms[$key] = [ordered]@{
                  download_url = $prev.download_url
                  bundle_name  = $prev.bundle_name
                  sha256       = $prev.sha256
                  signature    = $prev.signature
                  size         = $prev.size
                }
                Write-Host "Carried forward $key from the previous manifest (v$($prevManifest.version))"
              }
            }
          }

          # The flat fields stay, and stay describing the WINDOWS bundle. Every
          # client already installed reads them and knows nothing about
          # `platforms`; dropping them strands that entire population.
          $manifest = [ordered]@{
            version       = $version
            download_url  = "https://streamnook.app/download"
            bundle_name   = $bundleName
            sha256        = $winSha
            signature     = $signature
            size          = $winSize
            platforms     = $platforms
            notes         = (Get-Content ./changelog_section.md -Raw).TrimEnd()
            min_supported = "0.0.0"
            # Server-controlled client switches, read by src/services/clientConfig.ts.
            #
            # This block was MISSING, and the omission was silent and total. The
            # client reads `client_config.write_via_api` from this manifest to decide
            # whether privileged writes go to the StreamNook API or straight to
            # Supabase under the anon key, and this step rebuilds the manifest from
            # scratch on every release, so any hand-added block was wiped by the next
            # ship. The flag was therefore NEVER true in production: /api/v1/user/sync
            # received no traffic and `user_clients.version` had zero rows, which is
            # exactly the per-platform adoption signal it was built to provide.
            #
            # `min_supported_version` mirrors the top-level `min_supported` above,
            # which the Rust updater reads. Two names for one idea was the other half
            # of the bug: the client looked for a key nothing ever wrote.
            #
            # Kept at false here on purpose. The flag is a kill switch and its whole
            # point is being flippable WITHOUT a release, so flipping it is an edit to
            # latest.json in R2, not to this file. What matters is that the key now
            # EXISTS on every ship, so such an edit survives the next release.
            # Telemetry does not read it: the heartbeat in
            # services/telemetry_heartbeat.rs always posts to the API, because
            # telemetry gated on a flag nobody sets is telemetry that is off.
            client_config = [ordered]@{
              write_via_api         = $false
              min_supported_version = "0.0.0"
            }
            published_at  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          }
          $manifest | ConvertTo-Json -Depth 6 | Out-File -FilePath ./latest.json -Encoding utf8 -NoNewline
          npx --yes wrangler@4 r2 object put "streamnook-downloads/latest.json" `
            --file="latest.json" `
            --content-type="application/json" `
            --remote
          if ($LASTEXITCODE -ne 0) { throw "wrangler r2 manifest upload failed (exit $LASTEXITCODE)" }
          Write-Host "Uploaded latest.json (v$version) to R2 - live at https://streamnook.app/api/v1/update"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Minisign SECRET key for update signing. Generate with
          #   minisign -G -p streamnook-update.pub -s streamnook-update.key
          # then paste the .key contents here as a repo secret and the second
          # line of the .pub into UPDATE_PUBKEY in commands/components.rs.
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          # For attaching the .minisig to the already-created release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        if: steps.check_release.outputs.RELEASE_EXISTS == 'false' && env.DISCORD_RELEASE_WEBHOOK_URL != ''
        shell: pwsh
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $bundleName = "${{ steps.bundle.outputs.BUNDLE_NAME }}"
          $releaseUrl = "https://github.com/winters27/StreamNook/releases/tag/v$version"

          # --- Custom server emote substitution ---
          # Format: '<:name:snowflake_id>' for static, '<a:name:id>' for animated.
          # Get IDs by typing \:emote_name: in any Discord channel (Discord echoes the raw form).
          # With Components v2 every visible line is a Text Display, and custom emotes render in
          # any Text Display (including the title block), so all of them show. Leave a value
          # empty to keep the unicode fallback.
          $emoteMap = @{
            feature     = '<a:alert:1380653449305391104>'    # animated red exclamation
            bugfix      = '<a:check:1380653692000407572>'    # animated checkmark
            maintenance = '<:invoice:1384683220901167104>'   # document
            logo        = ''                                 # thumbnail already shows the Penrose logo
            rocket      = '<:bu_tg:1380653917452632064>'     # paper airplane ("shipped")
          }

          # Use the changelog body produced earlier (without the appended Bundle Components / Installation block)
          $body = Get-Content ./changelog_section.md -Raw

          # Strip the leading "## [version] - date" header — the version is shown in the title block
          $body = $body -replace '(?ms)^\s*##\s*\[?\d[\d\.]*\]?.*?\r?\n', ''
          $body = $body.Trim()

          # The release hero: the first markdown image in the section. Compaction below keeps
          # only headers and bullet leads, so without this the picture never reached Discord.
          # It becomes a Media Gallery component under the title (Discord shows the webp,
          # animated ones included). Must be an absolute https URL; the raw.githubusercontent
          # link resolves because dev was force-pushed to main before this step ran.
          $heroUrl = ''
          if ($body -match '!\[[^\]]*\]\((https://[^)\s]+)\)') { $heroUrl = $Matches[1] }

          # Compact the changelog for Discord. Changelog bullets are written as
          # "- **Bold lead.** explanation prose"; keep only the bold lead so the
          # post is a short scannable list. Section headers survive, everything
          # else (prose paragraphs, blockquotes, code fences, dividers) is dropped.
          # Full notes remain on the GitHub release, linked below.
          $compactLines = New-Object System.Collections.Generic.List[string]
          foreach ($line in ($body -split "`r?`n")) {
            if ($line -match '^#{2,3}\s') {
              if ($compactLines.Count -gt 0) { $compactLines.Add('') }
              $compactLines.Add($line)
            }
            elseif ($line -match '^\s*-\s+\*\*(.+?)\*\*') {
              $compactLines.Add('- ' + $Matches[1].TrimEnd('.', ',', ';', ':'))
            }
            elseif ($line -match '^\s*-\s+(\S.*)$') {
              # Bullet without a bold lead: keep just its first sentence.
              $first = ($Matches[1] -split '(?<=[.!?])\s+')[0]
              $compactLines.Add('- ' + $first.TrimEnd('.'))
            }
          }
          $body = ($compactLines -join "`n").Trim()

          # Promote section headers from H3 (### Features) to H2 (## Features) so every
          # section title renders at the same larger size. Only matches exactly three #.
          $body = $body -replace '(?m)^###\s+', '## '

          # Replace the changelog section-marker emojis with custom server emotes when configured.
          # release_manager.ps1 generates sections using ✨ / 🐛 / 🔧 (see Brain/projects/StreamNook.md).
          # Use ConvertFromUtf32 because 🐛 / 🔧 are above U+FFFF and don't fit in a single [char].
          $featureMarker     = [char]::ConvertFromUtf32(0x2728)   # ✨
          $bugfixMarker      = [char]::ConvertFromUtf32(0x1F41B)  # 🐛
          $maintenanceMarker = [char]::ConvertFromUtf32(0x1F527)  # 🔧
          if ($emoteMap.feature)     { $body = $body.Replace($featureMarker, $emoteMap.feature) }
          if ($emoteMap.bugfix)      { $body = $body.Replace($bugfixMarker, $emoteMap.bugfix) }
          if ($emoteMap.maintenance) { $body = $body.Replace($maintenanceMarker, $emoteMap.maintenance) }

          # Components v2 caps total text at 4000 chars across all text displays. The compacted
          # changelog is normally well under this; guard anyway and link out if it overflows.
          $maxLen = 3800
          if ($body.Length -gt $maxLen) {
            $body = $body.Substring(0, $maxLen).TrimEnd() + "`n`n[Read the full changelog on GitHub]($releaseUrl)"
          }

          # Split the compacted body into one block per changelog section (Features, Bug Fixes,
          # ...) so each gets its own Text Display with a real Separator between them, instead
          # of leaning on markdown whitespace for the visual break.
          $sections = New-Object System.Collections.Generic.List[string]
          $sb = New-Object System.Text.StringBuilder
          foreach ($line in ($body -split "`r?`n")) {
            if ($line -match '^#{2,3}\s' -and $sb.Length -gt 0) {
              $sections.Add($sb.ToString().Trim())
              $sb = New-Object System.Text.StringBuilder
            }
            [void]$sb.AppendLine($line)
          }
          if ($sb.Length -gt 0) { $sections.Add($sb.ToString().Trim()) }

          # --- Build the Discord Components v2 payload ---
          # Component types: 17 Container, 9 Section, 10 Text Display, 11 Thumbnail (accessory),
          # 14 Separator, 1 Action Row, 2 Button (style 5 = link). The IS_COMPONENTS_V2 message
          # flag (1<<15 = 32768) is required and disallows content/embeds, so the whole message
          # is components. Custom server emotes render inside any Text Display.
          $titleParts = @()
          if ($emoteMap.rocket) { $titleParts += $emoteMap.rocket }
          $titleText = "## StreamNook v$version is out"
          $liveLine = (($titleParts + "**It's live now.**") -join ' ')

          $children = New-Object System.Collections.Generic.List[object]

          # Header block: title + "live" line, with the app icon as a thumbnail accessory.
          $children.Add(@{
            type = 9
            components = @(@{ type = 10; content = "$titleText`n$liveLine" })
            accessory = @{ type = 11; media = @{ url = "https://raw.githubusercontent.com/winters27/StreamNook/main/src-tauri/icons/icon.png" } }
          })
          if ($heroUrl) {
            # Type 12 Media Gallery: one item, full width of the container.
            $children.Add(@{ type = 12; items = @(@{ media = @{ url = $heroUrl } }) })
          }
          $children.Add(@{ type = 14; divider = $true; spacing = 2 })

          # One Text Display per changelog section, thin divider between each.
          for ($i = 0; $i -lt $sections.Count; $i++) {
            $children.Add(@{ type = 10; content = $sections[$i] })
            if ($i -lt $sections.Count - 1) {
              $children.Add(@{ type = 14; divider = $true; spacing = 1 })
            }
          }

          $children.Add(@{ type = 14; divider = $true; spacing = 2 })
          # Link button to the release, plus a small footer line (v2 has no embed footer).
          $children.Add(@{
            type = 1
            components = @(@{ type = 2; style = 5; label = 'View release on GitHub'; url = $releaseUrl })
          })
          $children.Add(@{ type = 10; content = "-# Download $bundleName from the release page" })

          $payloadObj = @{
            flags = 32768  # IS_COMPONENTS_V2
            components = @(@{
              type = 17
              accent_color = 9941177  # #97B1B9 StreamNook accent
              components = $children
            })
          }
          $payload = $payloadObj | ConvertTo-Json -Depth 20 -Compress

          # ?with_components=true is required for a webhook to process a Components v2 payload.
          $uri = $env:DISCORD_RELEASE_WEBHOOK_URL + '?with_components=true'
          try {
            Invoke-RestMethod -Uri $uri -Method Post -ContentType 'application/json' -Body $payload | Out-Null
            echo "Discord notification sent for v$version"
          } catch {
            # Don't fail the workflow if Discord is down — release is already on GitHub.
            echo "::warning::Discord webhook post failed: $_"
          }

  # Joins the two parallel builds. Runs only after BOTH finish, and only does
  # anything if build-macos actually produced a bundle. Everything here used to
  # live at the end of the Windows job, which is what forced Windows to wait for
  # macOS; moving it out is the whole point of the split.
  # Warns when the macOS half of a release never landed.
  #
  # `finalize-macos` below is SKIPPED when build-macos produced no outputs, and a
  # skipped job is green in the run summary, so a release could ship with the
  # previous version's macOS entries standing and nothing said so. Every Mac then
  # stayed on the old build for the whole cycle, traced only by one log line on
  # the user's own machine. This job exists purely to make that visible.
  macos-status:
    needs: [build, build-macos]
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && needs.build.outputs.RELEASE_EXISTS == 'false'
          && needs.build-macos.outputs.BUNDLE_NAME == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Say that macOS did not ship
        run: |
          echo "::warning title=macOS was not published::v${{ needs.build.outputs.VERSION }} shipped WITHOUT a macOS build (build-macos result: ${{ needs.build-macos.result }}). The manifest still carries the PREVIOUS macOS entries, so Macs are offered the older build and will not see this release. Re-run the macOS job, or ship the next release once it is fixed."
          {
            echo "### macOS was not published"
            echo ""
            echo "\`v${{ needs.build.outputs.VERSION }}\` shipped without a macOS build."
            echo "build-macos result: \`${{ needs.build-macos.result }}\`"
            echo ""
            echo "Windows users have the update. Macs are still offered the previous"
            echo "release, which is the intended safe state, but they will not get this"
            echo "version until a macOS bundle is published."
          } >> "$GITHUB_STEP_SUMMARY"

  finalize-macos:
    needs: [build, build-macos]
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && needs.build.outputs.RELEASE_EXISTS == 'false'
          && needs.build-macos.outputs.BUNDLE_NAME != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch the macOS bundle
        uses: actions/download-artifact@v4
        with:
          name: macos-bundle
          path: macos-bundle

      - name: Attach the macOS bundle to the release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.VERSION }}"
          bundle="macos-bundle/${{ needs.build-macos.outputs.BUNDLE_NAME }}"
          gh release upload "v$version" "$bundle" --clobber
          [ -f "$bundle.minisig" ] && gh release upload "v$version" "$bundle.minisig" --clobber || true
          echo "Attached $(basename "$bundle") to v$version"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # Patch rather than rewrite. The Windows job already published a complete,
      # correct Windows manifest; re-deriving its fields here would duplicate that
      # logic and let the two drift. This only adds the two macOS keys.
      - name: Patch macOS into latest.json
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAC_BUNDLE: ${{ needs.build-macos.outputs.BUNDLE_NAME }}
          MAC_SHA: ${{ needs.build-macos.outputs.SHA256 }}
          MAC_SIG: ${{ needs.build-macos.outputs.SIGNATURE }}
          MAC_SIZE: ${{ needs.build-macos.outputs.SIZE }}
          MAC_URL: ${{ needs.build-macos.outputs.DOWNLOAD_URL }}
          VERSION: ${{ needs.build.outputs.VERSION }}
        run: |
          set -euo pipefail

          npx --yes wrangler@4 r2 object get "streamnook-downloads/latest.json" \
            --file=latest.json --remote
          test -s latest.json

          # Refuse to patch a manifest for a different release. Without this, a
          # slow macOS job could staple its bundle onto whatever version shipped
          # next, which is exactly the "offers an update it cannot download" case
          # the Windows manifest step guards against.
          have=$(jq -r '.version' latest.json)
          if [ "$have" != "$VERSION" ]; then
            echo "latest.json is v$have but this run is v$VERSION - refusing to patch"
            exit 1
          fi

          # --argjson below parses MAC_SIZE as JSON, so a blank or non-numeric
          # value would abort jq with a parse error rather than anything legible.
          case "$MAC_SIZE" in
            ''|*[!0-9]*) echo "build-macos gave a non-numeric SIZE: '$MAC_SIZE'"; exit 1 ;;
          esac
          test -n "$MAC_SHA" || { echo "build-macos gave an empty SHA256"; exit 1; }

          # Universal binary: one artifact serves both Mac architectures, so both
          # keys point at it rather than shipping two identical files.
          jq --arg url "$MAC_URL" --arg name "$MAC_BUNDLE" --arg sha "$MAC_SHA" \
             --arg sig "$MAC_SIG" --argjson size "$MAC_SIZE" \
             '.platforms["macos-aarch64"] = {download_url:$url, bundle_name:$name, sha256:$sha, signature:$sig, size:$size}
              | .platforms["macos-x86_64"] = .platforms["macos-aarch64"]' \
             latest.json > latest.patched.json
          test -s latest.patched.json

          npx --yes wrangler@4 r2 object put "streamnook-downloads/latest.json" \
            --file=latest.patched.json \
            --content-type="application/json" \
            --remote
          echo "Patched macOS ($MAC_BUNDLE) into latest.json for v$VERSION"

  # Warns when the Linux half of a release never landed. Exact twin of
  # macos-status, and it exists for the same reason: finalize-linux is SKIPPED
  # when build-linux produced no outputs, a skipped job is green in the run
  # summary, and the release would then ship with the previous version's Linux
  # entry standing with nothing saying so.
  linux-status:
    needs: [build, build-linux]
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && needs.build.outputs.RELEASE_EXISTS == 'false'
          && needs.build-linux.outputs.BUNDLE_NAME == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Say that Linux did not ship
        run: |
          echo "::warning title=Linux was not published::v${{ needs.build.outputs.VERSION }} shipped WITHOUT a Linux build (build-linux result: ${{ needs.build-linux.result }}). The manifest still carries the PREVIOUS linux-x86_64 entry, so Linux clients are offered the older build and will not see this release. Re-run the Linux job, or ship the next release once it is fixed."
          {
            echo "### Linux was not published"
            echo ""
            echo "\`v${{ needs.build.outputs.VERSION }}\` shipped without a Linux build."
            echo "build-linux result: \`${{ needs.build-linux.result }}\`"
            echo ""
            echo "Windows users have the update. Linux clients are still offered the"
            echo "previous release, which is the intended safe state, but they will not"
            echo "get this version until a Linux bundle is published."
          } >> "$GITHUB_STEP_SUMMARY"

  finalize-linux:
    # `finalize-macos` is in `needs` for ONE reason: both jobs do a
    # read-modify-write of the same latest.json in R2 (download, jq, upload).
    # Run concurrently they race, and the loser's platform keys are silently
    # dropped from the manifest that ships, which looks exactly like "the build
    # never published" while both jobs report success. Serializing them is the
    # cheap fix; the alternative is one combined finalize job, which would mean
    # rewriting the macOS path that already works.
    #
    # A SKIPPED finalize-macos (no Mac build this cycle) must not skip this job,
    # which is why the `if` leads with `!cancelled()` rather than relying on the
    # default needs-success behaviour.
    needs: [build, build-linux, finalize-macos]
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && needs.build.outputs.RELEASE_EXISTS == 'false'
          && needs.build-linux.outputs.BUNDLE_NAME != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch the Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: linux-bundle

      - name: Attach the Linux bundle to the release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.VERSION }}"
          bundle="linux-bundle/${{ needs.build-linux.outputs.BUNDLE_NAME }}"
          gh release upload "v$version" "$bundle" --clobber
          [ -f "$bundle.minisig" ] && gh release upload "v$version" "$bundle.minisig" --clobber || true
          echo "Attached $(basename "$bundle") to v$version"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # Patch rather than rewrite, same as finalize-macos: the Windows job has
      # already published a complete, correct Windows manifest and re-deriving
      # its fields here would let the two drift. This only adds the one Linux key.
      - name: Patch Linux into latest.json
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LINUX_BUNDLE: ${{ needs.build-linux.outputs.BUNDLE_NAME }}
          LINUX_SHA: ${{ needs.build-linux.outputs.SHA256 }}
          LINUX_SIG: ${{ needs.build-linux.outputs.SIGNATURE }}
          LINUX_SIZE: ${{ needs.build-linux.outputs.SIZE }}
          LINUX_URL: ${{ needs.build-linux.outputs.DOWNLOAD_URL }}
          VERSION: ${{ needs.build.outputs.VERSION }}
        run: |
          set -euo pipefail

          npx --yes wrangler@4 r2 object get "streamnook-downloads/latest.json" \
            --file=latest.json --remote
          test -s latest.json

          # Refuse to patch a manifest for a different release. Without this, a
          # slow Linux job could staple its bundle onto whatever version shipped
          # next, which is exactly the "offers an update it cannot download" case
          # the Windows manifest step guards against.
          have=$(jq -r '.version' latest.json)
          if [ "$have" != "$VERSION" ]; then
            echo "latest.json is v$have but this run is v$VERSION - refusing to patch"
            exit 1
          fi

          # --argjson parses LINUX_SIZE as JSON, so a blank or non-numeric value
          # would abort jq with a parse error rather than anything legible.
          case "$LINUX_SIZE" in
            ''|*[!0-9]*) echo "build-linux gave a non-numeric SIZE: '$LINUX_SIZE'"; exit 1 ;;
          esac
          test -n "$LINUX_SHA" || { echo "build-linux gave an empty SHA256"; exit 1; }

          # One key only. Unlike macOS there is no universal binary to alias: the
          # AppImage is x86_64, and an arm64 Linux client correctly resolves to
          # `None` (no update offered) rather than being handed an amd64 build.
          jq --arg url "$LINUX_URL" --arg name "$LINUX_BUNDLE" --arg sha "$LINUX_SHA" \
             --arg sig "$LINUX_SIG" --argjson size "$LINUX_SIZE" \
             '.platforms["linux-x86_64"] = {download_url:$url, bundle_name:$name, sha256:$sha, signature:$sig, size:$size}' \
             latest.json > latest.patched.json
          test -s latest.patched.json

          npx --yes wrangler@4 r2 object put "streamnook-downloads/latest.json" \
            --file=latest.patched.json \
            --content-type="application/json" \
            --remote
          echo "Patched Linux ($LINUX_BUNDLE) into latest.json for v$VERSION"
