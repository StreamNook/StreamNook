# Automatically derived from the `tauri::generate_handler!` list in src/main.rs.
# Regenerate if commands are added or removed; a command missing here is DENIED
# at runtime for every window, including the main UI.
#
# This file exists to close a real hole: with no app-level ACL manifest at all,
# Tauri skips the authorization check for app commands entirely
# (tauri/src/webview/mod.rs, "we only check ACL on plugin commands or if the app
# defined its ACL manifest"). That made every command below callable by any page
# loaded in any StreamNook webview, including the remote twitch.tv and kick.com
# pages the app opens for scraping and login. Defining this manifest turns the
# check back on; the capability that references it is local-only, so remote
# origins now get nothing unless explicitly granted in `remote-bridge.toml`.

[[permission]]
identifier = "app-commands"
description = "All StreamNook application commands. Granted to local application windows only."

[permission.commands]
allow = [
  "get_app_version",
  "get_app_name",
