[package]
name = "StreamNook"
version = "8.8.1"
description = "StreamNook"
authors = ["Brandon Winters"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "github.com/winters27/streamnook"
edition = "2021"

[[bin]]
name = "StreamNook"
path = "src/main.rs"

# Library target required by Tauri mobile: `tauri android`/`ios` build the app
# as a shared library that the generated Android/iOS project loads and calls
# `run()` on. `rlib` lets the desktop `[[bin]]` link this same lib; `cdylib` is
# the Android JNI library; `staticlib` is used by iOS later. Desktop builds are
# unchanged — the bin still compiles and runs as before.
[lib]
name = "streamnook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
# `tauri` itself is declared per target below: the runtime differs on Linux
# (CEF) and the feature set that picks the runtime cannot be expressed in one
# line. Every other dependency is runtime-agnostic and stays here.
tauri-plugin-shell = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-opener = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-window-state = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
# tauri-plugin-dialog is declared per target below: its Linux backend differs.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
cookie_store = "0.22.0"
anyhow = "1.0.100"
async-trait = "0.1.83"
warp = { version = "0.4.2", features = ["server", "websocket"] }
# Ref-counted response bodies for the media relays; already in the lock via warp/hyper.
bytes = "1"
futures = "0.3"
futures-util = { version = "0.3.31", features = ["sink"] }
rand = "0.10.2"
url = "2.5.7"
sha2 = "0.11.0"
sha1 = "0.11.0"  # SAPISIDHASH for the YouTube webview-session auth
base64 = "0.23.0"
# Song recognition: FFT + binary signature encoding for the vendored Shazam
# fingerprinter (services/song_id, MIT, from shazamio-core).
chfft = "0.3.4"
byteorder = "1.5"
crc32fast = "1.4"
lazy_static = "1.5.0"
dirs = "6.0.0"
regex = "1.12.2"
uuid = { version = "1.19.0", features = ["v4"] }
urlencoding = "2.1.3"
chrono = { version = "0.4.42", features = ["serde"] }
flate2 = "1.0"
scraper = "0.27.0"
# Allowlist HTML sanitizer for streamer-authored panel descriptions, which are
# rendered with dangerouslySetInnerHTML and would otherwise execute in a webview
# that holds the user's Twitch token.
ammonia = "4.1"
once_cell = "1.21.3"
spellbook = "0.4.2"
sevenz-rust = "0.6"
cosmic-text = "0.19.0"
scopeguard = "1.2"
phf = { version = "0.14", features = ["macros"] }
lru = "0.18"

# TikTok LIVE webcast reader (vendored in-tree, see vendor/tiktok-live). Pure-Rust
# ttwid-only connector (no signing service / no Python); deps pinned to match ours
# so cargo builds one shared tokio-tungstenite/reqwest stack.
tiktok-live = { path = "vendor/tiktok-live" }

# Plugin host: manifest parsing, version gating, artifact verification and unpack
toml = "1.1"
semver = "1"
minisign-verify = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

log = "0.4"
env_logger = "0.11"
tauri-plugin-deep-link = "2.4.7"
# Companion to deep-link: when a streamnook:// URL is opened while the app is
# already running, Windows launches a second copy with the URL as its argv.
# single-instance forwards that argv to the running instance (which re-feeds it
# to the deep-link plugin) instead of spawning a duplicate window.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-clipboard-manager = "2.3.2"
# Platform detection (frontend `@tauri-apps/plugin-os` platform() + backend cfg).
# Mobile-supported; used to pick the desktop vs mobile shell at runtime.
tauri-plugin-os = "2"
# Native OS notifications. On Android this posts real system notifications rather
# than the in-app Dynamic Island / toast surfaces the desktop uses.
# POST_NOTIFICATIONS was already declared in the manifest and the npm package was
# already a dependency, but nothing registered the Rust plugin, so the frontend
# had no way to request permission or actually post one.
tauri-plugin-notification = "2"

# Token vault (services/token_vault): AES-256-GCM over every stored credential.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
getrandom = "0.3"

# The Tauri runtime, per target.
#
# Windows, macOS, Android and iOS: Tauri's default features, which select the
# wry runtime (WebView2, WKWebView, the Android System WebView). This is the
# line the app has always had, only moved into a target table so the Linux
# table below can differ; the dependency graph on these targets is unchanged.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "2.9.4", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2.2.0"

# Linux: the same crates.io `tauri` with the `wry` feature OFF (its defaults
# minus wry are restated) and the Chromium Embedded Framework runtime supplied
# by the app through `tauri-runtime-cef`. `src/rt.rs` names the runtime type
# once; the `--type=` helper-process check in `main.rs` must run before any
# app code because CEF re-executes this binary for its renderer, GPU, utility
# and zygote processes. Feature unification is per compile target, so wry
# never enters the Linux graph and CEF never enters the others (`cargo tree
# --target` is the proof; `cargo metadata --filter-platform` lies about it).
[target.'cfg(target_os = "linux")'.dependencies]
tauri = { version = "2.9.4", default-features = false, features = [
    "compression",
    "common-controls-v6",
    "dynamic-acl",
    "protocol-asset",
    "tray-icon",
    "image-png",
] }
# Vendored (see vendor/tauri-runtime-cef/STREAMNOOK-VENDOR.md): SableClient's
# port of Tauri's unreleased `feat/cef` branch onto the published crates, at
# commit fbd0f206, with its `cef` pin moved to 151.8.1 so it binds the CEF
# 151.3.24 distribution StreamNook builds with proprietary codecs. The runtime
# checks CEF's API hash at startup, so the crate pin and the distribution move
# together; `CEF_PATH` must point at that distribution when building.
tauri-runtime-cef = { path = "vendor/tauri-runtime-cef" }
# The runtime is written against winit 0.31.0-beta.2. beta.3 renamed the
# drag-and-drop events and the runtime no longer compiles against it, so the
# app pins the exact pre-release the runtime was built for.
winit = "=0.31.0-beta.2"
# Sign-in overlays are made transient for the main window through
# WM_TRANSIENT_FOR directly (src/linux_x11.rs): the runtime answers
# `WebviewWindowBuilder::parent` with an error on Linux. Both crates are
# already in the Linux graph through the runtime; the versions match its.
x11-dl = "2.21"
raw-window-handle = "0.6"
# The second-launch forward to a running instance (src/linux_cef.rs) speaks
# tauri-plugin-single-instance's own D-Bus interface before the Tauri builder
# exists, because the runtime takes Chromium's profile lock before plugins
# initialise. Same zbus line the plugin resolves, so the tree carries one copy.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# Dialogs through xdg-desktop-portal, not rfd's GTK 3 backend: that backend
# pumps the default GLib main context on a thread of its own, which the CEF
# runtime's X11 event source also hangs on, and Chromium then dispatches X
# events off its UI sequence and dies in a mojo CHECK at the next window
# activation. The portal backend talks D-Bus only. Same version as the other
# targets, so the lock carries one copy.
tauri-plugin-dialog = { version = "2.2.0", default-features = false, features = ["xdg-portal"] }
# `gtk` is here for one call, `gtk::init` in src/linux_cef.rs: the tray icon's
# menu is a GTK menu and building it aborts in a process that never initialised
# GTK, which under CEF nothing else does. Pinned to the 0.18 line tauri and the
# runtime already resolve to, so the tree carries one copy. (The aspect lock in
# services/window_aspect.rs writes X11 WM_NORMAL_HINTS through x11-dl above
# and no longer uses GTK.)
#
# `target_os = "linux"` and NOT the `all(unix, not(macos))` shape the other
# platform shims use: Android is unix and has no GTK, but its target_os is
# "android", so this spelling excludes it and that one does not.
gtk = "0.18"
# Secret Service store for the token vault's key. libdbus is already linked
# (Tauri's window layer uses it); crypto-rust encrypts the session without OpenSSL.
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
# reqwest on Linux: rustls only. With native-tls (OpenSSL) every
# `reqwest::Client` build parses the system CA bundle (~150 certificates), and
# with the tokio workers building clients concurrently at boot they convoy on
# OpenSSL's locks and starve the renderer for seconds. The feature list is the
# Windows/macOS set (see the reqwest table below) minus `default-tls`, restated
# in full because `default-features = false` drops charset, http2 and
# system-proxy too. Same version as the other tables, so the lock carries one copy.
reqwest = { version = "0.12.24", default-features = false, features = ["json", "gzip", "cookies", "multipart", "rustls-tls", "http2", "charset", "system-proxy"] }

# Desktop-only native crates — gated off Android/iOS, which have no backend for
# them and would fail the mobile link. On desktop this cfg is true, so they build
# exactly as before. keyring-core = the OS credential store API that holds the
# token vault's key (services/token_vault; mobile keeps that key in the app sandbox);
# discord-rich-presence = Discord IPC;
# image/webp-animation = the animated-WebP profile-card capture (webp-animation
# wraps libwebp's encoder); image's jpeg decoder is for the card glow, which
# reads Twitch and YouTube thumbnails (services/media_glow). xcap, which grabs
# the real post-compositor WebView pixels for that capture, lives under the
# Windows table below; see the note there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
discord-rich-presence = "1.0.0"
# keyring-core holds the credential-store API; each OS's store is its own crate
# in the tables below, and services/token_vault opens the one for this target.
# Unlike keyring 3 (which silently fell back to an in-memory mock when no backend
# feature was on), an entry with no store is an error.
keyring-core = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
webp-animation = "0.10"

# Transport stack is split per platform: desktop keeps the OS TLS it shipped
# with (schannel on Windows, Security.framework on macOS); Android uses rustls
# with the bundled Mozilla roots so the cross-compile never links OpenSSL. All
# tables pin the same version so the lockfile carries ONE copy of each crate;
# resolver v2 only activates the table for the target being built.
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }

# reqwest on Windows and macOS: the default feature set (native-tls = schannel /
# Security.framework, charset, http2, system-proxy) plus rustls for the one
# client that opts into it (HTTP_RESOLVE in providers/kick.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "linux")))'.dependencies]
reqwest = { version = "0.12.24", features = ["json", "gzip", "cookies", "multipart", "rustls-tls"] }

# Linux's reqwest is rustls-only; it sits in the Linux table above.

# Android-only. `jni` backs src/android_notify.rs, the entry point the
# notification worker calls when there is no Tauri app to talk to. Pinned to the
# 0.21 line tauri and wry already resolve to, so the tree carries one copy.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
# http2 is load-bearing for Kick: its edge answers rustls over h1 with a 403
# and rustls over h2 with a 200 (see HTTP_RESOLVE in providers/kick.rs).
# default-features = false drops it, so it is named here.
reqwest = { version = "0.12.24", default-features = false, features = ["json", "gzip", "cookies", "multipart", "rustls-tls", "http2"] }

# webview2-com powers services/twitch_auth_service.rs (CookieManager).
# The windows crate features cover both that and the DXGI Output
# Duplication pipeline that backs commands/screen_capture.rs's animated
# WebP capture. DXGI gives us hardware-accelerated region-aware capture
# at the monitor's full refresh rate (60+ fps), with the crop happening
# GPU-side via CopySubresourceRegion into a staging texture sized
# exactly to the card — no full-monitor readback, no third-party binary.
[target.'cfg(windows)'.dependencies]
# Credential Manager store for the token vault's key. The default `search`
# feature only adds a regex dependency the vault never uses.
windows-native-keyring-store = { version = "1.1", default-features = false }
# xcap sits under the Windows target for the macOS port: 0.0.14 does not
# compile on modern rustc (E0282 in xcap-0.0.14/src/macos/boxed.rs). The
# upgrade to 0.9.x is a genuine refactor - its accessors became fallible -
# so it is tracked as its own change instead of riding along with the port.
xcap = "0.0.14"
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # services/window_aspect.rs: SetWindowSubclass/DefSubclassProc live in Shell,
    # GetDpiForWindow in HiDpi. The aspect lock constrains WM_SIZING live instead
    # of correcting the window after the drag has already committed a size.
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
] }

# macOS-only. WebKit's cookie store is read through these (see
# src/platform/cookies.rs) instead of Tauri's `cookies_for_url`, which on
# macOS pumps a nested run loop on the main thread inside tao's event
# dispatch; a redraw or a Dock click during that pump relocks tao's callback
# mutex on the same thread and the app hangs for good. Versions are the ones
# wry 0.55 already resolves to, so the lockfile keeps one copy of each crate.
[target.'cfg(target_os = "macos")'.dependencies]
# Login-keychain store for the token vault's key (the same items keyring 3 wrote).
apple-native-keyring-store = { version = "1", features = ["keychain"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSObject",
    "NSString",
    "NSArray",
    "NSHTTPCookie",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-app-kit",
    "block2",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
    "WKHTTPCookieStore",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Remote WebView inspection in a RELEASE build. Deliberately NOT in `default`.
#
# A release build is the only build that can be installed over a daily driver: a
# debug APK is debug-key-signed and fails INSTALL_FAILED_UPDATE_INCOMPATIBLE, and
# the uninstall that would fix that wipes login, cookie jar and settings. So
# profiling the app people actually run needs devtools ON in a release build.
#
# wry already does the work - it calls WebView.setWebContentsDebuggingEnabled
# under cfg(any(debug_assertions, feature = "devtools")) - so this only forwards
# the flag. Pass it per build:
#
#   npx tauri android build --apk --target aarch64 --features devtools
#
# then attach from a Chromium browser at chrome://inspect (Firefox cannot inspect
# a Chromium WebView). NEVER add this to `default`: the shipped build must not be
# remotely inspectable.
# On Linux the CEF runtime has a `devtools` feature of its own that tauri's
# does not switch on (and vice versa); naming a target-specific dependency
# here is legal and inert on the targets that do not have it.
devtools = ["tauri/devtools", "tauri-runtime-cef/devtools"]
[profile.release]
# opt-level 3: chat parsing and song-id FFT are CPU-hot, size-opt would cost them.
# panic stays "unwind": tokio tasks and warp handlers contain isolated panics
# today; abort would turn any one of them into a full-process death.
# strip = "debuginfo" keeps the symbol table so a macOS `sample` of a hung
# process names our Rust frames (the UI-hang watchdog takes that sample
# itself, see services/ui_hang_watchdog.rs). Windows is unaffected: debug
# info lives in the PDB and the PE carries no symtab to keep. Android already
# passes `-C strip=debuginfo` through RUSTFLAGS in scripts/android-build.sh.
# "symbols" saved a few MB of Mach-O symtab and made every macOS freeze
# report unreadable.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
