[package]
name = "StreamNook"
version = "8.6.3"
description = "StreamNook"
authors = ["Brandon Winters"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "github.com/winters27/streamnook"
edition = "2021"

[[bin]]
name = "StreamNook"
path = "src/main.rs"

# Library target required by Tauri mobile: `tauri android`/`ios` build the app
# as a shared library that the generated Android/iOS project loads and calls
# `run()` on. `rlib` lets the desktop `[[bin]]` link this same lib; `cdylib` is
# the Android JNI library; `staticlib` is used by iOS later. Desktop builds are
# unchanged — the bin still compiles and runs as before.
[lib]
name = "streamnook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
tauri = { version = "2.9.4", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-shell = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-opener = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-window-state = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
tauri-plugin-dialog = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
cookie_store = "0.22.0"
anyhow = "1.0.100"
async-trait = "0.1.83"
warp = { version = "0.4.2", features = ["server", "websocket"] }
# Ref-counted response bodies for the media relays; already in the lock via warp/hyper.
bytes = "1"
futures = "0.3"
futures-util = { version = "0.3.31", features = ["sink"] }
rand = "0.10.2"
url = "2.5.7"
sha2 = "0.11.0"
sha1 = "0.11.0"  # SAPISIDHASH for the YouTube webview-session auth
base64 = "0.23.0"
# Song recognition: FFT + binary signature encoding for the vendored Shazam
# fingerprinter (services/song_id, MIT, from shazamio-core).
chfft = "0.3.4"
byteorder = "1.5"
crc32fast = "1.4"
lazy_static = "1.5.0"
dirs = "6.0.0"
regex = "1.12.2"
uuid = { version = "1.19.0", features = ["v4"] }
urlencoding = "2.1.3"
chrono = { version = "0.4.42", features = ["serde"] }
flate2 = "1.0"
scraper = "0.27.0"
# Allowlist HTML sanitizer for streamer-authored panel descriptions, which are
# rendered with dangerouslySetInnerHTML and would otherwise execute in a webview
# that holds the user's Twitch token.
ammonia = "4.1"
once_cell = "1.21.3"
sevenz-rust = "0.6"
cosmic-text = "0.19.0"
scopeguard = "1.2"
phf = { version = "0.14", features = ["macros"] }
lru = "0.18"

# TikTok LIVE webcast reader (vendored in-tree, see vendor/tiktok-live). Pure-Rust
# ttwid-only connector (no signing service / no Python); deps pinned to match ours
# so cargo builds one shared tokio-tungstenite/reqwest stack.
tiktok-live = { path = "vendor/tiktok-live" }

# Plugin host: manifest parsing, version gating, artifact verification and unpack
toml = "1.1"
semver = "1"
minisign-verify = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

log = "0.4"
env_logger = "0.11"
tauri-plugin-deep-link = "2.4.7"
# Companion to deep-link: when a streamnook:// URL is opened while the app is
# already running, Windows launches a second copy with the URL as its argv.
# single-instance forwards that argv to the running instance (which re-feeds it
# to the deep-link plugin) instead of spawning a duplicate window.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-clipboard-manager = "2.3.2"
# Platform detection (frontend `@tauri-apps/plugin-os` platform() + backend cfg).
# Mobile-supported; used to pick the desktop vs mobile shell at runtime.
tauri-plugin-os = "2"
# Native OS notifications. On Android this posts real system notifications rather
# than the in-app Dynamic Island / toast surfaces the desktop uses.
# POST_NOTIFICATIONS was already declared in the manifest and the npm package was
# already a dependency, but nothing registered the Rust plugin, so the frontend
# had no way to request permission or actually post one.
tauri-plugin-notification = "2"

# Desktop-only native crates — gated off Android/iOS, which have no backend for
# them and would fail the mobile link. On desktop this cfg is true, so they build
# exactly as before. keyring = OS credential store (services/secure_store uses a
# file store on mobile instead); discord-rich-presence = Discord IPC;
# image/webp-animation = the animated-WebP profile-card capture (webp-animation
# wraps libwebp's encoder). xcap, which grabs the real post-compositor WebView
# pixels for that capture, lives under the Windows table below; see the note there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
discord-rich-presence = "1.0.0"
keyring = "3.6.3"
image = { version = "0.25", default-features = false, features = ["png"] }
webp-animation = "0.10"

# Transport stack is split per platform: desktop keeps the OS TLS it shipped
# with (schannel on Windows, Security.framework on macOS); Android uses rustls
# with the bundled Mozilla roots so the cross-compile never links OpenSSL. Both
# tables pin the same version so the lockfile carries ONE copy of each crate;
# resolver v2 only activates the table for the target being built.
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
reqwest = { version = "0.12.24", features = ["json", "gzip", "cookies", "multipart", "rustls-tls"] }

# Android-only. `jni` backs src/android_notify.rs, the entry point the
# notification worker calls when there is no Tauri app to talk to. Pinned to the
# 0.21 line tauri and wry already resolve to, so the tree carries one copy.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "gzip", "cookies", "multipart", "rustls-tls"] }

# webview2-com powers services/twitch_auth_service.rs (CookieManager).
# The windows crate features cover both that and the DXGI Output
# Duplication pipeline that backs commands/screen_capture.rs's animated
# WebP capture. DXGI gives us hardware-accelerated region-aware capture
# at the monitor's full refresh rate (60+ fps), with the crop happening
# GPU-side via CopySubresourceRegion into a staging texture sized
# exactly to the card — no full-monitor readback, no third-party binary.
[target.'cfg(windows)'.dependencies]
# xcap sits under the Windows target for the macOS port: 0.0.14 does not
# compile on modern rustc (E0282 in xcap-0.0.14/src/macos/boxed.rs). The
# upgrade to 0.9.x is a genuine refactor - its accessors became fallible -
# so it is tracked as its own change instead of riding along with the port.
xcap = "0.0.14"
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# macOS-only. WebKit's cookie store is read through these (see
# src/platform/cookies.rs) instead of Tauri's `cookies_for_url`, which on
# macOS pumps a nested run loop on the main thread inside tao's event
# dispatch; a redraw or a Dock click during that pump relocks tao's callback
# mutex on the same thread and the app hangs for good. Versions are the ones
# wry 0.55 already resolves to, so the lockfile keeps one copy of each crate.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSObject",
    "NSString",
    "NSArray",
    "NSHTTPCookie",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-app-kit",
    "block2",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
    "WKHTTPCookieStore",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Remote WebView inspection in a RELEASE build. Deliberately NOT in `default`.
#
# A release build is the only build that can be installed over a daily driver: a
# debug APK is debug-key-signed and fails INSTALL_FAILED_UPDATE_INCOMPATIBLE, and
# the uninstall that would fix that wipes login, cookie jar and settings. So
# profiling the app people actually run needs devtools ON in a release build.
#
# wry already does the work - it calls WebView.setWebContentsDebuggingEnabled
# under cfg(any(debug_assertions, feature = "devtools")) - so this only forwards
# the flag. Pass it per build:
#
#   npx tauri android build --apk --target aarch64 --features devtools
#
# then attach from a Chromium browser at chrome://inspect (Firefox cannot inspect
# a Chromium WebView). NEVER add this to `default`: the shipped build must not be
# remotely inspectable.
devtools = ["tauri/devtools"]
[profile.release]
# opt-level 3: chat parsing and song-id FFT are CPU-hot, size-opt would cost them.
# panic stays "unwind": tokio tasks and warp handlers contain isolated panics
# today; abort would turn any one of them into a full-process death.
# strip = "debuginfo" keeps the symbol table so a macOS `sample` of a hung
# process names our Rust frames (the UI-hang watchdog takes that sample
# itself, see services/ui_hang_watchdog.rs). Windows is unaffected: debug
# info lives in the PDB and the PE carries no symtab to keep. Android already
# passes `-C strip=debuginfo` through RUSTFLAGS in scripts/android-build.sh.
# "symbols" saved a few MB of Mach-O symtab and made every macOS freeze
# report unreadable.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
