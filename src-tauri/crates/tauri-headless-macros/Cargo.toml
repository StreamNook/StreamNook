# Macros for sn-tauri-headless, the stand-in for `tauri` in the iOS core build.
# `#[command]` keeps the function as written and adds a JSON entry point next
# to it; `generate_handler!` turns the command list into a name lookup over
# those entry points. Versions are the ones the lockfile already carries.
[package]
name = "sn-tauri-headless-macros"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full"] }
heck = "0.5"
